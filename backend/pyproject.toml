[project]
name = "tokscope-backend"
version = "0.1.0"
description = "Claude Code token usage dashboard backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "httpx", "pip-audit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","S","SIM","RUF","PL","ANN","PT","ASYNC","TRY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","PLR2004","ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
